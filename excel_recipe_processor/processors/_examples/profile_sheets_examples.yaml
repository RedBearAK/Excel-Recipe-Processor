# Usage examples and vocabulary for the profile_sheets processor.
#
# excel_recipe_processor/processors/_examples/profile_sheets_examples.yaml
#
# Part of the profile_* family (profile_files, profile_sheets, planned
# profile_workbooks): discovery steps that store metadata as ordinary
# stages. No "apply" siblings exist - consumers are other processors
# with directives that read the profile by COLUMN NAME (first consumer:
# format_excel's column_widths_from_stage).

description: "Per-column sheet metadata (widths, dtypes, blanks, distincts) as a stage"

basic_example:
  step_description: "Profile the main stage for view-tab width inheritance"
  processor_type: "profile_sheets"
  sheets:
    - source_stage: "stg_main_data"
  save_to_stage: "stg_sheet_profiles"

multi_input_example:
  step_description: "Profile a stage and a disk sheet side by side"
  processor_type: "profile_sheets"
  sheets:
    - source_stage: "stg_main_data"
    - input_file: "{lookup_dir}/reference.xlsx"
      sheet_name: "Rates"
  save_to_stage: "stg_sheet_profiles"
  min_width: 10
  max_width: 40

parameter_details:
  sheets:
    required: true
    description: >
      Non-empty list. Each entry profiles EXACTLY ONE of: source_stage
      (a stage in memory) or input_file + optional sheet_name (a disk
      sheet; first sheet when omitted). Memory vs disk is a pointer
      choice, not a mode - both land in the same output, identified by
      the Source column.
  save_to_stage:
    required: true
    description: "Stage receiving the profile frame"
  min_width:
    required: false
    description: "Width floor after padding (default 8; tpl_sizing uses 10)"
  max_width:
    required: false
    description: "Width ceiling after padding (default 100; tpl_sizing uses 40)"
  padding:
    required: false
    description: "Extra characters beyond the longest content (default 4, matching auto-fit)"
  scan_rows:
    required: false
    description: "Measure only the first N data rows (header always measured)"

output_contract:
  note: "Columns by NAME; future facts APPEND, never rename."
  columns:
    Source: "stage name, or file!sheet for disk inputs"
    Column: "header name"
    Position: "1-based column position"
    Width: "auto-fit width via the SHARED clamp (column_width_scan helper) - identical arithmetic to format_excel's auto-fit"
    Dtype: "pandas dtype string"
    Blank_Count: "NA values plus empty-string values"
    Distinct_Count: "distinct NON-BLANK values (empty strings do not survive an Excel round trip, so counting them would make stage and disk profiles of the same data disagree)"
    Row_Count: "data rows profiled"

consumer_example:
  step_description: "View tab inherits the seed sheet's widths"
  processor_type: "format_excel"
  target_file: "{output_dir}/output.xlsx"
  formatting:
    - sheet_name: "Exp_View"
      column_widths_from_stage: "stg_sheet_profiles"
      # column_widths_source: "stg_main_data"   # required only when the
      #                                         # profile holds >1 Source

# End of file #
